name: Build, Push to Build Branch, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write

jobs:
  build:
    # Only run on push, or if the PR was merged (not just closed)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can checkout branches

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, zip
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate Wayfinder types
        # Since you just ignored the generated Wayfinder files in .gitignore,
        # we MUST generate them before running 'npm run build' or Vite will fail.
        run: php artisan wayfinder:generate --with-form

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build:ssr

      - name: Commit and Push to 'build' branch
        run: |
          # Configure Git user for GitHub Actions Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Switch to 'build' branch, or create it based on current commit on main
          git checkout -B build
          
          # Force add the 'public/build' directory, SSR bundle, and wayfinder generated files
          git add -f public/build/
          git add -f bootstrap/ssr/
          git add -f resources/js/actions/
          git add -f resources/js/routes/
          git add -f resources/js/wayfinder/
          
          # Commit the changes (it will safely do nothing if there are no changes)
          git commit -m "Auto-build assets from main ($GITHUB_SHA)" || echo "No changes to commit"
          
          # Force push the 'build' branch back to GitHub
          # The secrets.GITHUB_TOKEN is automatically provided by GitHub Actions
          git push origin build --force

      - name: Deploy to Hostinger via Webhook
        run: |
          MAX_RETRIES=3
          RETRY=0

          until [ $RETRY -ge $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
              --max-time 300 \
              --connect-timeout 30 \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
              -H "Content-Type: application/json" \
              "${{ secrets.DEPLOY_WEBHOOK_URL }}")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deployment successful!"
              cat /tmp/deploy_response.json
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "⚠️ Deploy returned HTTP $HTTP_CODE (attempt $RETRY/$MAX_RETRIES)"
            cat /tmp/deploy_response.json 2>/dev/null || true

            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "❌ Deployment failed after $MAX_RETRIES attempts"
          exit 1
