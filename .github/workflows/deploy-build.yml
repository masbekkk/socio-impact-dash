name: Build, Push to Build Branch, and Deploy

on:
  push:
    branches:
      - v3.5.9-rev-finance
  pull_request:
    branches:
      - v3.5.9-rev-finance
    types: [closed]

permissions:
  contents: write

jobs:
  build:
    # Only run on push, or if the PR was merged (not just closed)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history so we can checkout branches

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, zip
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate Wayfinder types
        # Since you just ignored the generated Wayfinder files in .gitignore,
        # we MUST generate them before running 'npm run build' or Vite will fail.
        run: php artisan wayfinder:generate --with-form

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build:ssr

      - name: Commit and Push to 'buildv2.3.27' branch
        run: |
          # Configure Git user for GitHub Actions Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Switch to 'buildv2.3.27' branch, or create it based on current commit on v2.3.27
          git checkout -B buildv2.3.27
          
          # Force add the 'public/build' directory, SSR bundle, and wayfinder generated files
          git add -f public/build/
          git add -f bootstrap/ssr/
          git add -f resources/js/actions/
          git add -f resources/js/routes/
          git add -f resources/js/wayfinder/
          
          # Commit the changes (it will safely do nothing if there are no changes)
          git commit -m "Auto-build assets from v2.3.27 ($GITHUB_SHA)" || echo "No changes to commit"
          
          # Force push the 'build' branch back to GitHub
          # The secrets.GITHUB_TOKEN is automatically provided by GitHub Actions
          git push origin buildv2.3.27 --force

      - name: Deploy to Hostinger via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SERVER_IP }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
          PROJECT_PATH: ${{ secrets.DEPLOY_PROJECT_PATH }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_CMD="ssh -p 65002 -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          DEPLOY_SCRIPT="
            cd ${PROJECT_PATH}
            mkdir -p ~/.ssh && ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            git fetch origin buildv2.3.27 --depth 1
            git checkout buildv2.3.27
            git reset --hard origin/buildv2.3.27
            git clean -fd -e .htaccess -e .env -e .env.staging -e staging
            php artisan migrate --force --no-interaction
            php artisan optimize:clear
            echo '✅ Deployment completed successfully'
          "

          MAX_RETRIES=3
          RETRY=0
          WAIT=15

          until [ $RETRY -ge $MAX_RETRIES ]; do
            echo "🚀 Deploy attempt $((RETRY + 1))/$MAX_RETRIES..."
            if $SSH_CMD "$DEPLOY_SCRIPT"; then
              exit 0
            fi

            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "⚠️ SSH failed (attempt $RETRY/$MAX_RETRIES). Retrying in ${WAIT}s..."
              sleep $WAIT
              WAIT=$((WAIT * 2))
            fi
          done

          echo "❌ Deployment failed after $MAX_RETRIES attempts"
          exit 1
